services:
  hiveserver2:
    image: apache/hive:4.0.1
    container_name: tem1-hiveserver2
    hostname: hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./data:/tem1_2mom/eduardoantezana:ro
      - ./sql:/opt/sql:ro
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

volumes:
  hive-warehouse:
